<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Ultimate Visual Sticker Studio Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3f4f6;--surface:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--hint:#9ca3af;--blue:#3b82f6;--blue-light:#eff6ff;--green:#16a34a;--green-light:#f0fdf4;--red:#dc2626;--red-light:#fef2f2;--radius:12px;--shadow:0 1px 3px #00000014}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit}.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px 10px}.toprow{display:flex;align-items:center;gap:10px;margin-bottom:10px}.title{font-size:17px;font-weight:800;flex:1}.bt{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--muted)}.bt.connected{background:var(--green-light);border-color:#86efac;color:var(--green)}.dot{width:8px;height:8px;border-radius:50%;background:var(--hint)}.connected .dot{background:var(--green)}
.search{position:relative}.search input{width:100%;padding:10px 34px 10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:16px}.clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:20px;height:20px;background:var(--hint);color:#fff;display:none}
.filters{display:flex;gap:6px;padding:9px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chips{display:flex;gap:6px}.chip{padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--muted);white-space:nowrap;font-weight:600}.chip.active{background:var(--blue-light);border-color:#bfdbfe;color:#1d4ed8}.sort{margin-left:auto;padding:5px;border:1px solid var(--border);border-radius:7px;background:#fff}
.layout{display:flex;flex-direction:column;gap:16px;padding:16px}.left,.right{min-width:0}.count{font-size:13px;color:var(--hint);margin-bottom:9px}.grid{display:flex;flex-direction:column;gap:10px}.card,.workspace,.editor{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:14px}.card.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-light)}.name{font-size:15px;font-weight:800}.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:5px}.preview{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap;border-left:2px solid var(--border);padding-left:8px;max-height:46px;overflow:hidden}.card-actions{display:flex;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}.smallbtn{flex:1;padding:8px 5px;font-size:12px;font-weight:700;border-radius:7px;border:1px solid var(--border);background:#fff}.open{color:var(--blue);background:var(--blue-light);border-color:#bfdbfe}.delete{color:var(--red);background:var(--red-light);border-color:#fecaca;flex:0 0 58px}
.workspace{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px;overflow:hidden}.workspace-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}.workspace-head select{max-width:210px}
.stage-scroll{width:100%;overflow:auto;padding:3px;display:flex;justify-content:center}.canvas{position:relative;background:#fff;border:2px dashed #9ca3af;box-shadow:0 4px 12px #00000014;overflow:hidden;width:392px;height:232px;flex:0 0 auto;transform-origin:top left}.layer{position:absolute;left:20px;top:20px;padding:4px 6px;cursor:move;touch-action:none;user-select:none;white-space:pre;line-height:1.2;border:1px dashed transparent;color:#000}.layer.selected{border-color:var(--blue);background:#3b82f60a;z-index:10}.guide{position:absolute;inset:8px;border:1px dashed #ef444459;pointer-events:none}.guide:after{content:"Margin Safety Limit";position:absolute;bottom:2px;right:4px;font-size:9px;color:#ef444480;font-weight:700}
.editor{padding:15px}.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px}.tab{flex:1;text-align:center;padding:9px 4px;font-weight:700;font-size:12px;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.pane{display:none}.pane.active{display:block}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select,.workspace select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;outline:none;background:#fff;font-size:16px}.field textarea{min-height:68px;resize:vertical}.row{display:flex;gap:8px}.row .field{flex:1}.btnrow{display:flex;gap:6px;flex-wrap:wrap}.tool{flex:1;min-width:75px;padding:9px 6px;border:1px solid var(--border);background:#fff;font-weight:700;border-radius:8px;font-size:11px}.tool.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}.blue{background:var(--blue-light);color:#1d4ed8;border-color:#bfdbfe}.green{background:var(--green-light);color:var(--green);border-color:#86efac}.red{background:var(--red-light);color:var(--red);border-color:#fecaca}.backup{border-top:1px dashed var(--border);padding-top:12px;margin-top:14px}.footer{display:flex;gap:8px;margin-top:15px;padding-top:12px;border-top:1px solid var(--border)}.qty{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:112px}.qty button{padding:9px 12px;border:0;background:#f9fafb;font-weight:800}.qty input{width:100%;border:0;text-align:center;font-weight:800}.print{flex:1;padding:11px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:800}.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:20px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-size:28px;box-shadow:0 4px 14px #3b82f666;z-index:30}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:16px;max-width:80%;background:#1f2937;color:#fff;font-size:13px;padding:9px 14px;border-radius:20px;opacity:0;transition:.2s;z-index:100;pointer-events:none}.toast.show{opacity:1}.empty{text-align:center;padding:36px 20px;color:var(--hint)}.notice{font-size:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:8px;padding:9px;margin-bottom:12px;display:none}
@media(min-width:850px){.layout{flex-direction:row;align-items:flex-start}.left{flex:1}.right{flex:1;position:sticky;top:122px}}
@media(max-width:460px){.layout{padding:10px}.topbar{padding:10px}.title{font-size:14px}.bt{padding:7px 8px}.workspace,.editor{padding:11px}.stage-scroll{justify-content:flex-start}.canvas{transform:scale(.82);margin-right:-70px;margin-bottom:-42px}.workspace-head{align-items:flex-start;flex-direction:column}.workspace-head select{max-width:none}.btnrow .tool{min-width:calc(50% - 6px)}}
</style>
</head>
<body>
<header class="topbar"><div class="toprow"><span class="title">🏷️ Ultimate Visual Sticker Studio Pro</span><button class="bt" id="bt-btn" onclick="toggleBluetooth()"><span class="dot"></span><span id="bt-label">Connect Printer</span></button></div><div class="search"><input id="search" placeholder="Search templates… e.g. brake pad, Myvi" oninput="searchChanged(this.value)"><button class="clear" id="clear" onclick="clearSearch()">×</button></div></header>
<div class="filters"><div class="chips" id="filters"></div><select class="sort" id="sort" onchange="renderList()"><option value="recent">Recent</option><option value="az">A–Z</option><option value="za">Z–A</option></select></div>
<main class="layout">
<section class="left"><div class="count" id="count"></div><div class="grid" id="grid"></div></section>
<section class="right">
<div class="workspace"><div class="workspace-head"><span>📐 LIVE CANVAS STAGE</span><select id="canvas-size" onchange="changeCanvasSize(this.value)"><option value="49x29">49 × 29 mm</option><option value="40x30">40 × 30 mm</option><option value="50x30">50 × 30 mm</option></select></div><div class="stage-scroll"><div class="canvas" id="canvas" onclick="deselectAll()"><div class="guide"></div></div></div></div>
<div class="editor"><div class="notice" id="ios-notice">This iPhone browser can edit and save stickers, but direct Web Bluetooth printing is unavailable. Use a compatible desktop browser or your printer manufacturer’s iPhone app to print.</div>
<div class="tabs"><button class="tab active" data-pane="content">Content</button><button class="tab" data-pane="style">Style</button><button class="tab" data-pane="align">Position</button></div>
<div class="pane active" id="pane-content">
<div class="field"><label>Template Name</label><input id="profile-name" placeholder="e.g. Myvi OM Brake Pad Front" oninput="profile.name=this.value"></div>
<div class="field"><label>Category</label><select id="profile-cat" onchange="profile.cat=this.value"></select></div>
<div class="field"><label>Selected Text Layer</label><textarea id="layer-text" placeholder="Tap a text layer above to edit" oninput="updateText(this.value)"></textarea></div>
<div class="btnrow"><button class="tool blue" onclick="addText()">+ Text Layer</button><button class="tool blue" onclick="addBarcode()">+ Barcode</button><button class="tool green" onclick="saveTemplate()">💾 Save Template</button></div>
<div class="backup"><div class="field"><label>Backups & Batch Import</label></div><div class="btnrow"><button class="tool" onclick="exportJSON()">Backup JSON</button><button class="tool" onclick="document.getElementById('json-file').click()">Restore JSON</button><button class="tool" onclick="document.getElementById('csv-file').click()">Import CSV</button></div><input hidden type="file" id="json-file" accept=".json,application/json" onchange="importJSON(this)"><input hidden type="file" id="csv-file" accept=".csv,text/csv" onchange="importCSV(this)"></div>
</div>
<div class="pane" id="pane-style">
<div class="field"><label>Font Family</label><select id="font" onchange="updateFont(this.value)"><option>Arial</option><option>Courier New</option><option>Times New Roman</option><option value="sans-serif">System Sans</option></select></div>
<div class="field"><label>Font Size</label><div class="row"><input type="range" id="size" min="12" max="38" value="16" oninput="updateSize(this.value)"><strong id="size-label">16px</strong></div></div>
<div class="btnrow"><button class="tool" id="bold" onclick="toggleBold()">Bold</button></div>
<div class="field" style="margin-top:14px"><label>Printer Protocol</label><select id="language"><option value="tspl">TSPL</option><option value="zpl">ZPL</option><option value="escpos">ESC/POS</option></select></div>
<div class="field"><label>TSPL Color Mode</label><select id="color-mode"><option value="inverted">Mode B — White Background</option><option value="standard">Mode A — Standard</option></select></div>
</div>
<div class="pane" id="pane-align"><div class="field"><label>Quick Alignment</label><div class="btnrow"><button class="tool" onclick="alignLayer('center-h')">Center X</button><button class="tool" onclick="alignLayer('center-v')">Center Y</button><button class="tool" onclick="alignLayer('top')">Top</button><button class="tool" onclick="alignLayer('bottom')">Bottom</button></div></div><div class="row"><div class="field"><label>X Position</label><input type="number" id="x" oninput="setPosition('left',this.value)"></div><div class="field"><label>Y Position</label><input type="number" id="y" oninput="setPosition('top',this.value)"></div></div><button class="tool red" style="width:100%" onclick="deleteLayer()">Remove Active Layer</button></div>
<div class="footer"><div class="qty"><button onclick="adjustQty(-1)">−</button><input type="number" id="qty" value="1" min="1"><button onclick="adjustQty(1)">+</button></div><button class="print" onclick="executePrintJob()">🖨️ Send to Printer</button></div>
</div></section></main>
<button class="fab" onclick="newTemplate()" aria-label="Create new template">+</button><div class="toast" id="toast"></div><canvas id="raster" width="392" height="232" hidden></canvas>
<script>
var STORAGE_KEY="xprinter_visual_stickers_v2";
var CATS={all:{label:"All"},car:{label:"Car Part",bg:"#ecfdf5",color:"#065f46"},shipping:{label:"Shipping",bg:"#eff6ff",color:"#1e40af"},product:{label:"Product",bg:"#fff7ed",color:"#92400e"},address:{label:"Address",bg:"#fdf4ff",color:"#6b21a8"},barcode:{label:"Barcode",bg:"#f0f9ff",color:"#0c4a6e"},custom:{label:"Custom",bg:"#fff1f2",color:"#9f1239"}};
var DEFAULTS=[{id:1,name:"Myvi 1.3 OM ATF Filter",cat:"car",layers:[{id:"l1",text:"MYVI 1.3 OM ATF FILTER",left:20,top:20,size:24,bold:true,fontFamily:"Arial"},{id:"l2",text:"MMY  LTL  MRY\nDE-AWZIWCMFY\nRM27         7/26",left:20,top:65,size:18,bold:false,fontFamily:"Arial"}]},{id:2,name:"Myvi OM Brake Pad",cat:"car",layers:[{id:"l1",text:"Myvi OM Brake Pad",left:20,top:20,size:22,bold:true,fontFamily:"Arial"},{id:"l2",text:"Part: Brake Pad\nCar: Perodua Myvi\nBrand: Premium\nQty: 1 Set\nPrice: RM 45.00",left:20,top:55,size:15,bold:false,fontFamily:"Arial"}]}];
var stickers=[],profile=null,activeLayer=null,activeFilter="all",query="",btDevice=null,btChar=null,drag=null,startX=0,startY=0,origX=0,origY=0;
function el(id){return document.getElementById(id)}function clone(x){return JSON.parse(JSON.stringify(x))}
function loadData(){try{var d=JSON.parse(localStorage.getItem(STORAGE_KEY));stickers=d&&Array.isArray(d.stickers)?d.stickers:clone(DEFAULTS)}catch(e){stickers=clone(DEFAULTS)}if(!localStorage.getItem(STORAGE_KEY))persist();if(stickers.length)openTemplate(stickers[0].id);else newTemplate()}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify({stickers:stickers}))}
function newTemplate(){profile={id:Date.now(),name:"New Custom Part Tag",cat:"car",layers:[{id:"l-"+Date.now(),text:"ITEM DESCRIPTION INFO",left:20,top:20,size:18,bold:true,fontFamily:"Arial"}]};el("profile-name").value=profile.name;el("profile-cat").value=profile.cat;buildCanvas();activatePane("content");renderList()}
function openTemplate(id){var t=stickers.find(function(x){return x.id===id});if(!t)return;profile=clone(t);el("profile-name").value=profile.name;el("profile-cat").value=profile.cat;buildCanvas();renderList()}
function buildCanvas(){var c=el("canvas");c.innerHTML='<div class="guide"></div>';activeLayer=null;profile.layers.forEach(function(l,i){var d=document.createElement("div");d.className="layer";d.id=l.id;d.textContent=l.text;d.style.left=l.left+"px";d.style.top=l.top+"px";d.style.fontSize=l.size+"px";d.style.fontWeight=l.bold?"bold":"normal";d.style.fontFamily=l.fontFamily||"Arial";d.onclick=function(e){selectLayer(d,e)};d.onpointerdown=startDrag;c.appendChild(d);if(i===0)selectLayer(d)});if(!profile.layers.length){el("layer-text").value=""}}
function selectLayer(d,e){if(e)e.stopPropagation();document.querySelectorAll(".layer").forEach(function(x){x.classList.remove("selected")});activeLayer=d;d.classList.add("selected");var l=getLayer();if(!l)return;el("layer-text").value=l.text;el("size").value=l.size;el("size-label").textContent=l.size+"px";el("x").value=Math.round(l.left);el("y").value=Math.round(l.top);el("font").value=l.fontFamily||"Arial";el("bold").classList.toggle("active",l.bold)}
function getLayer(){return activeLayer&&profile.layers.find(function(x){return x.id===activeLayer.id})}function deselectAll(){document.querySelectorAll(".layer").forEach(function(x){x.classList.remove("selected")});activeLayer=null}
function startDrag(e){e.preventDefault();drag=e.currentTarget;selectLayer(drag,e);startX=e.clientX;startY=e.clientY;origX=parseFloat(drag.style.left)||0;origY=parseFloat(drag.style.top)||0;drag.setPointerCapture(e.pointerId)}
document.addEventListener("pointermove",function(e){if(!drag)return;var c=el("canvas"),nx=Math.max(0,Math.min(c.clientWidth-40,origX+e.clientX-startX)),ny=Math.max(0,Math.min(c.clientHeight-20,origY+e.clientY-startY)),l=getLayer();drag.style.left=nx+"px";drag.style.top=ny+"px";if(l){l.left=nx;l.top=ny}el("x").value=Math.round(nx);el("y").value=Math.round(ny)});
document.addEventListener("pointerup",function(){drag=null});
function updateText(v){var l=getLayer();if(l){l.text=v;activeLayer.textContent=v}}function updateSize(v){var l=getLayer();if(l){l.size=parseInt(v);activeLayer.style.fontSize=v+"px";el("size-label").textContent=v+"px"}}function updateFont(v){var l=getLayer();if(l){l.fontFamily=v;activeLayer.style.fontFamily=v}}function toggleBold(){var l=getLayer();if(l){l.bold=!l.bold;activeLayer.style.fontWeight=l.bold?"bold":"normal";el("bold").classList.toggle("active",l.bold)}}
function setPosition(p,v){var l=getLayer(),n=parseInt(v)||0;if(!l)return;if(p==="left")l.left=n;else l.top=n;activeLayer.style[p]=n+"px"}
function alignLayer(mode){var l=getLayer(),c=el("canvas");if(!l)return;if(mode==="center-h")l.left=Math.round((c.clientWidth-activeLayer.clientWidth)/2);if(mode==="center-v")l.top=Math.round((c.clientHeight-activeLayer.clientHeight)/2);if(mode==="top")l.top=10;if(mode==="bottom")l.top=c.clientHeight-activeLayer.clientHeight-10;activeLayer.style.left=l.left+"px";activeLayer.style.top=l.top+"px";el("x").value=l.left;el("y").value=l.top}
function addText(){var id="l-"+Date.now();profile.layers.push({id:id,text:"NEW TEXT BLOCK",left:30,top:40,size:16,bold:false,fontFamily:"Arial"});buildCanvas();selectLayer(el(id))}
function addBarcode(){var v=prompt("Enter Barcode / Part Code:","PART-1234");if(!v)return;var id="l-"+Date.now();profile.layers.push({id:id,text:"||| |||| || ||||\n*"+v.toUpperCase()+"*",left:30,top:120,size:16,bold:true,fontFamily:"Courier New"});buildCanvas();selectLayer(el(id))}
function deleteLayer(){var l=getLayer();if(!l)return;profile.layers=profile.layers.filter(function(x){return x.id!==l.id});buildCanvas()}
function saveTemplate(){if(!profile.name.trim())return alert("Template name cannot be blank.");var i=stickers.findIndex(function(x){return x.id===profile.id});if(i>=0)stickers[i]=clone(profile);else stickers.unshift(clone(profile));persist();renderList();toast("Template saved")}
function deleteTemplate(id,e){if(e)e.stopPropagation();if(!confirm("Delete this template?"))return;stickers=stickers.filter(function(x){return x.id!==id});persist();if(profile&&profile.id===id){stickers.length?openTemplate(stickers[0].id):newTemplate()}renderList()}
function searchChanged(v){query=v;el("clear").style.display=v?"block":"none";renderList()}function clearSearch(){query="";el("search").value="";el("clear").style.display="none";renderList()}function setFilter(v){activeFilter=v;renderList()}
function renderList(){var tokens=query.toLowerCase().trim().split(/\s+/).filter(Boolean),list=stickers.filter(function(s){if(activeFilter!=="all"&&s.cat!==activeFilter)return false;var hay=(s.name+" "+s.layers.map(function(l){return l.text}).join(" ")).toLowerCase();return tokens.every(function(t){return hay.includes(t)})}),sort=el("sort").value;if(sort==="az")list.sort(function(a,b){return a.name.localeCompare(b.name)});else if(sort==="za")list.sort(function(a,b){return b.name.localeCompare(a.name)});else list.sort(function(a,b){return b.id-a.id});
el("filters").innerHTML=Object.keys(CATS).map(function(k){var n=k==="all"?stickers.length:stickers.filter(function(s){return s.cat===k}).length;if(k!=="all"&&!n)return "";return '<button class="chip '+(activeFilter===k?"active":"")+'" onclick="setFilter(\''+k+'\')">'+CATS[k].label+" ("+n+")</button>"}).join("");el("count").textContent=list.length+" template"+(list.length===1?"":"s")+" found";el("grid").innerHTML=list.length?list.map(function(s){var c=CATS[s.cat]||CATS.custom,p=s.layers.map(function(l){return l.text}).join(" | ");return '<article class="card '+(profile&&profile.id===s.id?"active":"")+'" id="card-'+s.id+'" onclick="openTemplate('+s.id+')"><div class="name">'+escapeHtml(s.name)+'</div><span class="badge" style="background:'+c.bg+";color:"+c.color+'">'+c.label+'</span><div class="preview">'+escapeHtml(p)+'</div><div class="card-actions"><button class="smallbtn open" onclick="openTemplate('+s.id+')">Open & Edit</button><button class="smallbtn delete" onclick="deleteTemplate('+s.id+',event)">Delete</button></div></article>'}).join(""):'<div class="empty">No matching templates.</div>'}
function changeCanvasSize(v){var sizes={"49x29":[392,232],"40x30":[320,240],"50x30":[400,240]},s=sizes[v];el("canvas").style.width=s[0]+"px";el("canvas").style.height=s[1]+"px";el("raster").width=s[0];el("raster").height=s[1];toast("Canvas changed to "+v+" mm")}
function activatePane(name){document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.dataset.pane===name)});document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("active",p.id==="pane-"+name)})}
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){activatePane(t.dataset.pane)}});el("profile-cat").innerHTML=Object.keys(CATS).filter(function(k){return k!=="all"}).map(function(k){return '<option value="'+k+'">'+CATS[k].label+"</option>"}).join("");
function exportJSON(){if(!stickers.length)return alert("No templates to back up.");download("sticker_studio_backup_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({stickers:stickers},null,2),"application/json")}
function importJSON(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.stickers))throw Error();if(confirm("Tap OK to merge. Tap Cancel to replace.")){var ids=new Set(stickers.map(function(s){return s.id}));d.stickers.forEach(function(s){if(!ids.has(s.id)){stickers.push(s);ids.add(s.id)}})}else stickers=d.stickers;persist();renderList();if(stickers.length)openTemplate(stickers[0].id);toast("Backup restored")}catch(e){alert("Invalid sticker backup file.")}input.value=""};r.readAsText(f)}
function parseCSVLine(line){var out=[],cur="",quoted=false;for(var i=0;i<line.length;i++){var ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===","&&!quoted){out.push(cur);cur=""}else cur+=ch}out.push(cur);return out}
function importCSV(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var lines=r.result.split(/\r?\n/).filter(function(x){return x.trim()}),count=0;lines.forEach(function(line,i){var p=parseCSVLine(line);if(i===0&&p[0].toLowerCase().includes("name"))return;var name=(p[0]||"").trim(),detail=(p[1]||"").trim();if(name){var id=Date.now()+i;stickers.push({id:id,name:name,cat:"car",layers:[{id:"a"+id,text:name.toUpperCase(),left:20,top:20,size:20,bold:true,fontFamily:"Arial"},{id:"b"+id,text:detail,left:20,top:55,size:15,bold:false,fontFamily:"Arial"}]});count++}});persist();renderList();toast(count+" CSV items imported");input.value=""};r.readAsText(f)}
function download(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
async function toggleBluetooth(){if(!navigator.bluetooth){el("ios-notice").style.display="block";return alert("Direct Web Bluetooth printing is not supported by this browser. You can still design, save, back up and import templates.");}if(btDevice&&btDevice.gatt.connected){btDevice.gatt.disconnect();btDevice=null;btChar=null;updateBt(false);return}try{btDevice=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["000018f0-0000-1000-8000-00805f9b34fb","0000ff00-0000-1000-8000-00805f9b34fb","49535343-fe7d-4ae5-8fa9-9fafd205e455"]});var server=await btDevice.gatt.connect(),services=await server.getPrimaryServices();for(var s of services){var chars=await s.getCharacteristics();btChar=chars.find(function(c){return c.properties.write||c.properties.writeWithoutResponse});if(btChar)break}if(!btChar)throw Error("No writable printer characteristic found.");updateBt(true,btDevice.name||"Printer")}catch(e){if(e.name!=="NotFoundError")alert("Bluetooth connection failed: "+e.message)}}
function updateBt(ok,name){el("bt-btn").classList.toggle("connected",ok);el("bt-label").textContent=ok?name:"Connect Printer"}
async function executePrintJob(){if(!navigator.bluetooth)return toggleBluetooth();if(!btChar)return alert('Connect the printer first.');var qty=Math.max(1,parseInt(el("qty").value)||1),rc=el("raster"),ctx=rc.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,rc.width,rc.height);profile.layers.forEach(function(l){ctx.fillStyle="#000";ctx.font=(l.bold?"bold ":"")+l.size+"px "+(l.fontFamily||"Arial");ctx.textBaseline="top";l.text.split("\n").forEach(function(line,i){ctx.fillText(line,l.left,l.top+i*l.size*1.2)})});var img=ctx.getImageData(0,0,rc.width,rc.height).data,wb=Math.ceil(rc.width/8),bitmap=new Uint8Array(wb*rc.height);for(var y=0;y<rc.height;y++)for(var x=0;x<rc.width;x++){var n=(y*rc.width+x)*4,b=(img[n]+img[n+1]+img[n+2])/3;if(b<200)bitmap[y*wb+Math.floor(x/8)]|=1<<(7-x%8)}var lang=el("language").value,enc=new TextEncoder(),payload;if(lang==="zpl"){var hex=Array.from(bitmap).map(function(b){return b.toString(16).padStart(2,"0")}).join("").toUpperCase();payload=enc.encode("^XA^LL"+rc.height+"^GFA,"+bitmap.length+","+bitmap.length+","+wb+","+hex+"^PQ"+qty+"^XZ")}else if(lang==="escpos"){var head=new Uint8Array([27,64,29,118,48,0,wb&255,wb>>8,rc.height&255,rc.height>>8]),foot=new Uint8Array([29,86,65,0]);payload=joinBytes(head,bitmap,foot)}else{if(el("color-mode").value==="inverted")for(var i=0;i<bitmap.length;i++)bitmap[i]=~bitmap[i];payload=joinBytes(enc.encode("SIZE 49 mm,29 mm\r\nGAP 2 mm,0 mm\r\nDIRECTION 1\r\nCLS\r\nBITMAP 0,0,"+wb+","+rc.height+",0,"),bitmap,enc.encode("\r\nPRINT "+qty+"\r\n"))}try{for(var j=0;j<payload.length;j+=100){var part=payload.slice(j,j+100);if(btChar.properties.writeWithoutResponse)await btChar.writeValueWithoutResponse(part);else await btChar.writeValue(part);await new Promise(function(r){setTimeout(r,20)})}toast("Print job sent")}catch(e){alert("Transmission failed: "+e.message)}}
function joinBytes(){var arrays=Array.from(arguments),len=arrays.reduce(function(s,a){return s+a.length},0),out=new Uint8Array(len),o=0;arrays.forEach(function(a){out.set(a,o);o+=a.length});return out}
function adjustQty(n){el("qty").value=Math.max(1,(parseInt(el("qty").value)||1)+n)}function escapeHtml(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}var toastTimer;function toast(m){el("toast").textContent=m;el("toast").classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){el("toast").classList.remove("show")},2400)}
if(!navigator.bluetooth)el("ios-notice").style.display="block";loadData();renderList();
